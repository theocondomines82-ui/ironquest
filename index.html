<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IronQuest">
<meta name="theme-color" content="#0f1220">
<title>IronQuest</title>
<style>
:root{color-scheme:dark;--bg:#0f1220;--card:#1a1f36;--ac:#f59e0b;--tx:#eef0f8;--mu:#8b93b5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
#app{max-width:480px;margin:0 auto;padding:16px 0 40px}
h1,h2,h3{margin:.6em 0 .3em}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid #2c3354;border-radius:12px;padding:12px 14px}
button.big{display:block;width:100%;margin:8px 0;background:var(--ac);color:#1a1200;border:0;font-weight:700;padding:16px}
button.ghost{background:none;color:var(--mu);margin-top:12px;width:100%;border:0}
input[type=number]{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid #2c3354;background:var(--card);color:var(--tx)}
.ck{display:block;padding:8px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2 label{font-size:14px;color:var(--mu)}
.top{display:flex;justify-content:space-between;align-items:center}
.top span{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}
.n{aspect-ratio:1;font-size:24px;padding:0}
.n.d{opacity:.5}.n.l{opacity:.35}.n.c{border-color:var(--ac);box-shadow:0 0 12px var(--ac)}
.bar{height:14px;background:#2c3354;border-radius:7px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:100%;background:#ef4444;transition:width .2s}
.cam{position:relative;border-radius:12px;overflow:hidden;background:#000;margin:8px 0}
.cam video,.cam canvas{display:block;width:100%;transform:scaleX(-1)}
.cam canvas{position:absolute;inset:0;height:100%}
.hint{color:var(--ac);min-height:22px;text-align:center}
.reps{text-align:center;font-size:44px;font-weight:800;margin:4px 0}
.row{display:flex;gap:8px;margin:8px 0;align-items:center}.row button{flex:1}
.enemy{text-align:center;font-size:64px}
.sm{color:var(--mu);font-size:14px}
body{min-height:100vh}
.hero{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.av{font-size:38px}.gold{font-weight:700}
.n{position:relative;overflow:hidden}
.n span{display:block}.n.l span{filter:brightness(0);opacity:.5}.n.d span{opacity:.4}
.n b{position:absolute;right:4px;bottom:0;font-size:14px;color:#4ade80}
.n.c{animation:pulse 1.2s infinite}
.n.boss{grid-column:1/-1;aspect-ratio:auto;height:84px;font-size:46px}
@keyframes pulse{50%{box-shadow:0 0 22px var(--ac);transform:scale(1.06)}}
.stage{position:relative;text-align:center;padding:14px 0;margin:6px 0;border-radius:16px;background:radial-gradient(circle,#ffffff14,#0000 70%)}
.stage.boss{box-shadow:0 0 30px #ef444488 inset}
.en{font-size:104px;line-height:1.1;animation:bob 2s ease-in-out infinite;display:inline-block}
.stage.boss .en{font-size:124px;filter:drop-shadow(0 0 18px #ef4444)}
@keyframes bob{50%{transform:translateY(-10px)}}
.en.hit{animation:hit .3s}
@keyframes hit{25%{transform:translateX(-14px) rotate(-6deg);filter:brightness(2) sepia(1) hue-rotate(-40deg) saturate(6)}75%{transform:translateX(14px) rotate(6deg)}}
.stage.atk{animation:atk .4s}
@keyframes atk{50%{background:#ef444455;transform:scale(1.03)}}
.dmg{position:absolute;top:30%;font-size:34px;font-weight:900;color:#fff;text-shadow:0 2px 6px #000;animation:fl .9s forwards;pointer-events:none}
.dmg.crit{color:var(--ac);font-size:48px}
@keyframes fl{to{transform:translateY(-70px);opacity:0}}
.cb{text-align:center;font-weight:800;color:var(--ac);min-height:24px;font-size:20px}
.bar.r{height:10px}.bar.r i{background:linear-gradient(90deg,#a78bfa,#f472b6);width:0}
body.shake{animation:sh .3s}
@keyframes sh{25%{transform:translate(-6px,3px)}75%{transform:translate(6px,-3px)}}
.cam{max-height:150px}.cam video{height:150px;object-fit:cover}.cam canvas{object-fit:cover}
.tl{color:#ef4444}
#app{padding-bottom:110px}
.card{background:#1a1f36cc;border:1px solid #2c3354;border-radius:16px;padding:14px;margin:10px 0}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0b0e1bf2;backdrop-filter:blur(8px);padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #2c3354;z-index:9}
#nav button{flex:1;background:none;border:0;color:var(--mu);font-size:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button.on{color:var(--ac)}#nav svg{width:24px;height:24px}
.sw{width:44px;height:44px;border-radius:50%;padding:0;border:2px solid #2c3354;flex:0 0 auto}
.sw.t{width:auto;border-radius:12px;padding:8px 12px}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--ac)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles .card{margin:0;text-align:center}.tiles b{font-size:26px;display:block}
</style></head>
<body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const WN=['Forêt des Gobelins','Marais Maudit','Montagne de Feu','Citadelle de Glace','Abysses du Néant'];
const EE=['👺','🐀','🦇','🕷️','🐺','🧟','💀','👻','🐗','🦂','🐍','👹','🧌','🗿'];
const EN=['Gobelin','Rat géant','Chauve-souris','Araignée','Loup','Zombie','Squelette','Fantôme','Sanglier','Scorpion','Serpent','Ogre','Troll','Golem'];
const BE=['🐉','👑','😈','🦑','☠️'],BN=['Dragon ancestral','Roi des marais','Démon de lave','Seigneur du gel','Titan du néant'];
const IT={potion:'🧪 Potion de temps (+15 s)',epee:'⚔️ Épée (dégâts ×2 pendant 5 reps)',bombe:'💣 Bombe (-3 PV)'};
const EX={
 pompes:{n:'Pompes',i:'💪',j:[[11,13,15],[12,14,16]],lo:90,hi:150,fast:1.6},
 squats:{n:'Squats',i:'🦵',j:[[23,25,27],[24,26,28]],lo:105,hi:155,fast:1.8},
 tractions:{n:'Tractions',i:'🧗',j:[[11,13,15],[12,14,16]],lo:80,hi:150,fast:2},
 curls:{n:'Curls haltères',i:'🏋️',j:[[11,13,15],[12,14,16]],lo:60,hi:140,fast:1.8}
};
let st=null,f=null,tm=0,lm=null,stream=null,camOK=false,raf=0;
try{st=JSON.parse(localStorage.getItem('iq'))}catch(e){}
const save=()=>{try{localStorage.setItem('iq',JSON.stringify(st))}catch(e){}};
const E=(w,k)=>k==14?{e:BE[(w-1)%5],n:BN[(w-1)%5],boss:1}:{e:EE[k],n:EN[k]};
const need=x=>Math.max(3,Math.round(st.m[x]*(.25+.03*st.enemy+.12*(st.world-1))*(st.enemy==14?1.3:1)));
const tlim=x=>Math.round(25+need(x)*3.5);

function onboard(){
 app.innerHTML=`<h1>⚔️ IronQuest</h1><p>Crée ton héros. Les ennemis s’adaptent à ton niveau.</p>
 <h3>Ton matériel</h3>
 <label class=ck><input type=checkbox id=e_bar> Barre de traction</label>
 <label class=ck><input type=checkbox id=e_hal> Haltères</label>
 <label class=ck><input type=checkbox id=e_gym> Salle de sport (tout le matériel)</label>
 <h3>Ton corps</h3>
 <div class=g2><label>Poids (kg)<input type=number id=w inputmode=numeric></label><label>Taille (cm)<input type=number id=h inputmode=numeric></label></div>
 <h3>Tes performances</h3><p class=sm>Combien de répétitions d’affilée, au maximum ? Laisse 0 si tu ne fais pas l’exercice.</p>
 <div class=g2><label>Pompes<input type=number id=m_p inputmode=numeric></label><label>Squats<input type=number id=m_s inputmode=numeric></label>
 <label>Tractions<input type=number id=m_t inputmode=numeric></label><label>Curls haltères<input type=number id=m_c inputmode=numeric></label></div>
 <button class=big onclick=go()>Commencer l’aventure</button>`;
}
function go(){
 const g=id=>+($('#'+id).value)||0,c=id=>$('#'+id).checked,gym=c('e_gym');
 const m={pompes:Math.max(g('m_p'),1),squats:Math.max(g('m_s'),1),tractions:(c('e_bar')||gym)?g('m_t'):0,curls:(c('e_hal')||gym)?g('m_c'):0};
 st={w:g('w'),h:g('h'),m,world:1,enemy:0,inv:{potion:1,epee:0,bombe:0}};save();map();
}
const invH=()=>`🧪 ×${st.inv.potion} &nbsp; ⚔️ ×${st.inv.epee} &nbsp; 💣 ×${st.inv.bombe}`;
function map(){
 const w=st.world,i=st.enemy;let g='';
 for(let k=0;k<15;k++)g+=`<button class="n ${k<i?'d':k==i?'c':'l'}" onclick="pick(${k})">${k<i?'✔':k==i?E(w,k).e:'🔒'}</button>`;
 app.innerHTML=`<div class=top><h2>Monde ${w}</h2><span>${WN[(w-1)%5]}</span></div>
 <p class=sm>Ennemi ${i+1} / 15${i==14?' — BOSS':''}</p><div class=grid>${g}</div>
 <p>Inventaire : ${invH()}</p><button class=ghost onclick=reset()>Recommencer à zéro</button>`;
}
function pick(k){
 if(k!=st.enemy)return;const en=E(st.world,k);
 const av=Object.keys(EX).filter(x=>st.m[x]>0);
 app.innerHTML=`<div class=enemy>${en.e}</div><h2 style="text-align:center">${en.n}${en.boss?' (BOSS)':''}</h2><p>Choisis ton arme :</p>`+
 av.map(x=>`<button class=big onclick="fight('${x}')">${EX[x].i} ${EX[x].n} : ${need(x)} reps en ${tlim(x)} s</button>`).join('')+
 `<button class=ghost onclick=map()>Retour</button>`;
}
function fight(x){
 const n=need(x),en=E(st.world,st.enemy);
 f={x,n,hp:n,t:tlim(x),ph:'up',t0:performance.now(),run:false,epee:0};
 app.innerHTML=`<div class=top><b>${en.e} ${en.n}</b><span id=tt></span></div>
 <div class=bar><i id=hp></i></div>
 <div class=cam id=cam><video id=v playsinline muted></video><canvas id=cv></canvas></div>
 <div class=hint id=hint></div><div class=reps id=rp></div><div class=hint id=fx></div>
 <button class=big id=st onclick=begin()>▶ Commencer</button>
 <div class=row><button onclick=rep(false)>✓ Rep</button><button onclick=rep(true)>⚡ Rep explosive</button></div>
 <div class=row id=items></div><button class=ghost onclick=quit()>Fuir</button>`;
 upd();startCam();
}
function upd(){
 if(!f)return;
 $('#hp').style.width=Math.max(0,f.hp/f.n*100)+'%';
 $('#rp').textContent=Math.max(0,f.hp)+' PV';
 $('#tt').textContent=Math.ceil(f.t)+' s';
 $('#items').innerHTML=Object.keys(IT).map(k=>`<button onclick="use('${k}')">${IT[k].split(' ')[0]} ×${st.inv[k]}</button>`).join('')+(f.epee?`<span>⚔️ ${f.epee}</span>`:'');
}
function begin(){
 let n=3;const b=$('#st');b.disabled=true;b.textContent=n--;
 const c=setInterval(()=>{
  if(!f){clearInterval(c);return}
  if(n>0){b.textContent=n--;return}
  clearInterval(c);b.style.display='none';f.run=true;f.ph='up';f.t0=performance.now();
  tm=setInterval(()=>{f.t-=.1;f.t<=0?lose():upd()},100);
 },1000);
}
function rep(c){
 if(!f||!f.run)return;
 const d=(f.epee>0?2:1)*(c?2:1);if(f.epee>0)f.epee--;
 f.hp-=d;$('#fx').textContent=(c?'⚡ CRITIQUE ! ':'')+'-'+d+' PV';
 f.hp<=0?win():upd();
}
function use(k){
 if(!f||!f.run||!st.inv[k])return;st.inv[k]--;
 if(k=='potion')f.t+=15;else if(k=='epee')f.epee=5;else{f.hp-=3;$('#fx').textContent='💣 -3 PV'}
 save();f.hp<=0?win():upd();
}
function end(h){stopCam();clearInterval(tm);f=null;app.innerHTML=h+`<button class=big onclick=map()>Continuer</button>`}
function win(){
 f.run=false;const boss=st.enemy==14,en=E(st.world,st.enemy),loot=[];
 const n=boss?2:(Math.random()<.5?1:0),ks=Object.keys(IT);
 for(let i=0;i<n;i++){const k=ks[Math.random()*3|0];st.inv[k]++;loot.push(IT[k])}
 st.enemy++;let up='';
 if(st.enemy>=15){st.enemy=0;st.world++;up=`<h3>🌍 Monde ${st.world} débloqué !</h3><p>Les ennemis sont plus forts.</p>`}
 save();
 end(`<div class=enemy>🏆</div><h2 style="text-align:center">${en.n} vaincu !</h2>`+(loot.length?`<h3>Butin :</h3><p>${loot.join('<br>')}</p>`:`<p>Pas de butin cette fois.</p>`)+up);
}
function lose(){end(`<div class=enemy>💀</div><h2 style="text-align:center">Défaite</h2><p>Le temps est écoulé. Réessaie, tu peux le battre !</p>`)}
function quit(){stopCam();clearInterval(tm);f=null;map()}
function reset(){if(confirm('Tout effacer ?')){try{localStorage.removeItem('iq')}catch(e){}st=null;onboard()}}

/* Caméra + détection de pose (MediaPipe) */
const ang=(a,b,c)=>{const r=Math.atan2(c.y-b.y,c.x-b.x)-Math.atan2(a.y-b.y,a.x-b.x);const d=Math.abs(r*180/Math.PI);return d>180?360-d:d};
const hint=t=>{const h=$('#hint');if(h)h.textContent=t};
async function startCam(){
 hint('Chargement de la caméra…');
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});
  const v=$('#v');v.srcObject=stream;await v.play();
  if(!lm){
   const B='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
   const m=await import(B+'/vision_bundle.mjs');
   const fs=await m.FilesetResolver.forVisionTasks(B+'/wasm');
   lm=await m.PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:1});
  }
  camOK=true;hint('Pose le téléphone à 1,5–2 m, tout le corps visible');loop();
 }catch(e){
  camOK=false;const c=$('#cam');if(c)c.style.display='none';hint('Caméra indisponible : utilise les boutons Rep');
 }
}
function stopCam(){camOK=false;cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function loop(){
 if(!f||!camOK)return;
 const v=$('#v');
 if(v&&v.readyState>=2){
  const r=lm.detectForVideo(v,performance.now()),p=r.landmarks&&r.landmarks[0];
  draw(p);if(p&&f.run)analyze(p);
 }
 raf=requestAnimationFrame(loop);
}
function draw(p){
 const c=$('#cv'),v=$('#v');if(!c)return;
 c.width=v.videoWidth;c.height=v.videoHeight;
 if(!p)return;const x=c.getContext('2d');x.fillStyle='#4ade80';
 for(let i=11;i<29;i++){x.beginPath();x.arc(p[i].x*c.width,p[i].y*c.height,5,0,7);x.fill()}
}
function analyze(p){
 const e=EX[f.x];let best=null;
 for(const j of e.j){const[a,b,c]=j.map(i=>p[i]);const vis=Math.min(a.visibility,b.visibility,c.visibility);if(!best||vis>best.v)best={v:vis,a:ang(a,b,c)}}
 if(best.v<.5){hint('Place-toi entièrement dans le cadre');return}
 hint('✅ Détection OK');
 const A=best.a,now=performance.now();
 if(f.ph=='up'){if(A>e.hi)f.t0=now;else if(A<e.lo)f.ph='low'}
 else if(A>e.hi){f.ph='up';const crit=(now-f.t0)<e.fast*1000;f.t0=now;rep(crit)}
}
</script><script>
const TH=[['#0b2b17','#1d5a35'],['#171329','#35502c'],['#2b0d0d','#6b2410'],['#0b2236','#24608a'],['#07070f','#46246e']];
const TT=['Novice','Apprenti','Guerrier','Champion','Légende'];
const SHOP=[['potion','🧪 Potion de temps',30],['epee','⚔️ Épée',50],['bombe','💣 Bombe',40]];
const fix=()=>{st.xp=st.xp||0;st.gold=st.gold||0;st.force=st.force||0};
const lvlOf=()=>Math.floor(st.xp/100)+1;
function theme(){const t=TH[(st.world-1)%5];document.body.style.background=`linear-gradient(180deg,${t[0]},${t[1]}) fixed`}
function map(){
 fix();theme();const w=st.world,i=st.enemy,L=lvlOf(),xp=st.xp%100;let g='';
 for(let k=0;k<15;k++){const en=E(w,k);g+=`<button class="n ${k<i?'d':k==i?'c':'l'}${k==14?' boss':''}" onclick="pick(${k})"><span>${en.e}</span>${k<i?'<b>✔</b>':''}</button>`}
 app.innerHTML=`<div class=hero><div class=av>🥷</div><div style="flex:1"><b>${TT[Math.min(4,L/3|0)]} · Niv. ${L}</b><div class=bar><i style="width:${xp}%;background:#38bdf8"></i></div><span class=sm>${xp}/100 XP</span></div><div class=gold>🪙 ${st.gold}</div></div>
 <div class=top><h2>Monde ${w}</h2><span>${WN[(w-1)%5]}</span></div><div class=grid>${g}</div>
 <p>${invH()}${st.force?' &nbsp; 💪 Force '+st.force:''}</p><button class=big onclick=shop()>🛒 Boutique</button><button class=ghost onclick=reset()>Recommencer à zéro</button>`;
}
function shop(){
 fix();const fc=100*(st.force+1);
 app.innerHTML=`<div class=top><h2>🛒 Boutique</h2><b>🪙 ${st.gold}</b></div>`+SHOP.map(s=>`<button class=big onclick="buy('${s[0]}',${s[2]})">${s[1]} · ${s[2]} 🪙</button>`).join('')+
 `<button class=big style="background:#a78bfa" onclick="buy('force',${fc})">💪 Force niv. ${st.force+1} · ${fc} 🪙<br><span class=sm style="color:#1a1200">+8 % de chance de dégâts ×2 par niveau</span></button><p>Inventaire : ${invH()}</p><button class=ghost onclick=map()>Retour</button>`;
}
function buy(k,p){if(st.gold<p){alert('Pas assez d’or. Bats des ennemis !');return}st.gold-=p;k=='force'?st.force++:st.inv[k]++;save();shop()}
function fight(x){
 fix();theme();const n=need(x),en=E(st.world,st.enemy);
 f={x,n,hp:n,t:tlim(x),ph:'up',t0:performance.now(),run:false,epee:0,combo:0,rage:0,idle:0,atk:0,boss:!!en.boss};
 app.innerHTML=`<div class=top><b>${en.n}${en.boss?' 👑':''}</b><span id=tt></span></div>
 <div class="stage${en.boss?' boss':''}" id=stage><div class=en id=en2>${en.e}</div></div>
 <div class=bar><i id=hp></i></div><div class=hint id=hpt style="min-height:0"></div>
 <div class="bar r"><i id=rg></i></div><div class=cb id=cb></div>
 <div class=cam id=cam><video id=v playsinline muted></video><canvas id=cv></canvas></div>
 <div class=hint id=hint></div><div class=hint id=fx></div>
 <button class=big id=st onclick=begin()>▶ Commencer</button>
 <div class=row><button onclick=rep(false)>✓ Rep</button><button onclick=rep(true)>⚡ Rep explosive</button></div>
 <div class=row id=items></div><button class=ghost onclick=quit()>Fuir</button>`;
 upd();startCam();
}
function upd(){
 if(!f)return;
 $('#hp').style.width=Math.max(0,f.hp/f.n*100)+'%';
 $('#hpt').textContent=Math.max(0,f.hp)+' / '+f.n+' PV';
 const t=$('#tt');t.textContent=Math.ceil(f.t)+' s';t.className=f.t<10?'tl':'';
 $('#cb').textContent=f.combo>=3?`🔥 COMBO x${f.combo}`+(f.combo>=10?' (+2 dégâts)':f.combo>=5?' (+1 dégât)':''):'';
 $('#rg').style.width=f.rage+'%';
 $('#items').innerHTML=(f.rage>=100?`<button style="background:#a78bfa;color:#1a1200;font-weight:800" onclick=ulti()>💥 ULTIME</button>`:'')+Object.keys(IT).map(k=>`<button onclick="use('${k}')">${IT[k].split(' ')[0]} ×${st.inv[k]}</button>`).join('')+(f.epee?`<span>⚔️ ${f.epee}</span>`:'');
}
function fxHit(d,c){
 const s=$('#stage'),e=$('#en2');if(!s)return;
 e.classList.remove('hit');void e.offsetWidth;e.classList.add('hit');
 const p=document.createElement('span');p.className='dmg'+(c?' crit':'');p.textContent='-'+d;p.style.left=(30+Math.random()*40)+'%';
 s.appendChild(p);setTimeout(()=>p.remove(),900);
 if(c){document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),300)}
}
function begin(){
 let n=3;const b=$('#st');b.disabled=true;b.textContent=n--;
 const c=setInterval(()=>{
  if(!f){clearInterval(c);return}
  if(n>0){b.textContent=n--;return}
  clearInterval(c);b.style.display='none';f.run=true;f.ph='up';f.t0=performance.now();
  tm=setInterval(()=>{
   f.t-=.1;f.idle+=.1;f.atk+=.1;
   if(f.idle>4)f.combo=0;
   if(f.idle>=6&&f.hp<f.n){f.hp++;f.idle=3;$('#fx').textContent='💚 L’ennemi se régénère !'}
   if(f.atk>=(f.boss?7:10)){f.atk=0;f.t-=3;f.combo=0;f.rage=Math.max(0,f.rage-20);$('#fx').textContent='💢 L’ennemi frappe : -3 s';const s=$('#stage');s.classList.add('atk');setTimeout(()=>s.classList.remove('atk'),400)}
   f.t<=0?lose():upd();
  },100);
 },1000);
}
function rep(c){
 if(!f||!f.run)return;
 f.combo++;f.idle=0;
 let d=(f.epee>0?2:1)*(c?2:1)+(f.combo>=10?2:f.combo>=5?1:0);

}
